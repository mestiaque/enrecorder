[package]
name = "enrec-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ENRecorder core: database, settings, FFmpeg service, system detection, storage, capture interfaces"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
parking_lot = "0.12"
# Bundled SQLite: the same library on every platform, no system package needed.
rusqlite = { version = "0.32", features = ["bundled"] }
# UUID primary keys (brief §13).
uuid = { version = "1", features = ["v4"] }
# Free/total space of the volume that holds the recordings (one small, maintained crate).
fs4 = { version = "0.13", features = ["sync"] }

[dev-dependencies]
tempfile = "3"

[features]
# Wayland capture (xdg-desktop-portal ScreenCast + PipeWire through GStreamer's pipewiresrc).
# The desktop app enables it; at run time it needs gstreamer1.0-pipewire and gstreamer1.0-tools.
wayland = ["dep:ashpd", "dep:libc", "dep:tokio"]

[target.'cfg(target_os = "linux")'.dependencies]
# X11 capture backend: window and monitor lists (pure Rust XCB client, no C library needed).
x11rb = { version = "0.13", features = ["randr"] }
# Wayland: the portal client (D-Bus).
ashpd = { version = "0.11", default-features = false, features = ["tokio"], optional = true }
# Passing the portal's PipeWire descriptor to the GStreamer reader (dup2 in the child).
libc = { version = "0.2", optional = true }
tokio = { version = "1", features = ["rt", "time", "macros"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Windows capture backend: monitors (DXGI outputs, as ddagrab numbers them) and windows.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
