<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <clipPath id="clip"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
    <filter id="blobBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1E1B4B" flood-opacity="0.4"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="recGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fold" gradientUnits="userSpaceOnUse" x1="286" y1="196" x2="374" y2="344">
      <stop offset="0" stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <radialGradient id="rec" cx="0.38" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FECDD3"/>
      <stop offset="0.45" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#E11D48"/>
    </radialGradient>

    <!-- Letter strokes, reused for depth layers -->
    <g id="strokes" fill="none" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
      <path d="M218 196 H138 V344 H218 M138 270 H204"/>
      <path d="M286 344 V196"/>
      <path d="M374 344 V196"/>
      <path d="M286 196 L374 344"/>
    </g>
  </defs>

  <!-- Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- Soft colour blobs behind the glass -->
  <g clip-path="url(#clip)" filter="url(#blobBlur)">
    <circle cx="130" cy="120" r="140" fill="#F43F5E" opacity="0.5"/>
    <circle cx="410" cy="410" r="160" fill="#38BDF8" opacity="0.55"/>
  </g>

  <!-- Glass panel -->
  <g filter="url(#glassShadow)">
    <rect x="72" y="72" width="368" height="368" rx="84" fill="#FFFFFF" fill-opacity="0.14"
          stroke="url(#glassStroke)" stroke-width="2.5"/>
  </g>
  <path d="M156 72 H356 A84 84 0 0 1 440 156 V200 H72 V156 A84 84 0 0 1 156 72 Z" fill="url(#shine)"/>

  <!-- Subtle 3D: soft shadow + translucent depth -->
  <use href="#strokes" stroke="#1E1B4B" opacity="0.35" transform="translate(0 18)" filter="url(#soft)"/>
  <use href="#strokes" stroke="#3730A3" opacity="0.55" transform="translate(0 7)"/>

  <!-- EN front faces -->
  <g filter="url(#glow)" fill="none" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <path d="M218 196 H138 V344 H218 M138 270 H204" stroke="#FFFFFF"/>
    <path d="M286 344 V196" stroke="#FFFFFF"/>
    <path d="M374 344 V196" stroke="#FFFFFF"/>
    <path d="M286 196 L374 344" stroke="url(#fold)"/>
  </g>

  <!-- Recording dot -->
  <circle cx="374" cy="128" r="22" fill="#881337" opacity="0.45" transform="translate(0 6)"/>
  <circle cx="374" cy="128" r="22" fill="url(#rec)" filter="url(#recGlow)"/>
</svg>
