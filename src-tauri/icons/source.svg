<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3F3F46"/>
      <stop offset="1" stop-color="#09090B"/>
    </linearGradient>
    <clipPath id="clip"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
    <filter id="blobBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glassShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="glassStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fold" gradientUnits="userSpaceOnUse" x1="274" y1="182" x2="362" y2="330">
      <stop offset="0" stop-color="#FECACA"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="play" gradientUnits="userSpaceOnUse" x1="184" y1="226" x2="232" y2="286">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>

    <!-- Letter strokes, reused for depth layers -->
    <g id="strokes" fill="none" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
      <path d="M230 182 H150 V330 H230"/>
      <path d="M274 330 V182"/>
      <path d="M362 330 V258"/>
      <path d="M274 182 L362 330"/>
    </g>
    <radialGradient id="rec" gradientUnits="userSpaceOnUse" cx="210" cy="247" r="12">
      <stop offset="0" stop-color="#FCA5A5"/>
      <stop offset="1" stop-color="#EF4444"/>
    </radialGradient>
    <linearGradient id="micGrad" gradientUnits="userSpaceOnUse" x1="0" y1="162" x2="0" y2="234">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FCA5A5"/>
    </linearGradient>
    <g id="mic">
      <rect x="342" y="162" width="40" height="72" rx="20"/>
      <path d="M328 210 A34 34 0 0 0 396 210" fill="none" stroke-width="10" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>

  <!-- Soft colour blobs behind the glass -->
  <g clip-path="url(#clip)" filter="url(#blobBlur)">
    <circle cx="130" cy="120" r="140" fill="#EF4444" opacity="0.55"/>
    <circle cx="410" cy="410" r="160" fill="#8B5CF6" opacity="0.5"/>
  </g>

  <!-- Glass panel -->
  <g filter="url(#glassShadow)">
    <rect x="72" y="72" width="368" height="368" rx="84" fill="#FFFFFF" fill-opacity="0.1"
          stroke="url(#glassStroke)" stroke-width="2.5"/>
  </g>
  <path d="M156 72 H356 A84 84 0 0 1 440 156 V200 H72 V156 A84 84 0 0 1 156 72 Z" fill="url(#shine)"/>

  <!-- Subtle 3D: soft shadow + translucent depth -->
  <use href="#strokes" stroke="#1E1B4B" opacity="0.35" transform="translate(0 18)" filter="url(#soft)"/>
  <use href="#strokes" stroke="#52525B" opacity="0.7" transform="translate(0 7)"/>

  <!-- EN front faces -->
  <g filter="url(#glow)" fill="none" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <path d="M230 182 H150 V330 H230" stroke="#FFFFFF"/>
    <path d="M274 330 V182" stroke="#FFFFFF"/>
    <path d="M362 330 V258" stroke="#FFFFFF"/>
    <!-- Folded ribbon diagonal -->
    <path d="M274 182 L362 330" stroke="url(#fold)"/>
  </g>
  <!-- Screen-capture corner brackets -->
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M104 148 V118 H134"/>
    <path d="M378 118 H408 V148"/>
    <path d="M408 364 V394 H378"/>
    <path d="M134 394 H104 V364"/>
  </g>

  <!-- Screen + record dot as the E's middle bar -->
  <g transform="translate(0 6)" opacity="0.5" fill="none" stroke="#000000" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="182" y="228" width="62" height="44" rx="8"/>
    <path d="M213 272 V284 M201 286 H225"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <rect x="182" y="228" width="62" height="44" rx="8"/>
    <path d="M213 272 V284 M201 286 H225"/>
  </g>
  <circle cx="213" cy="250" r="11" fill="url(#rec)" filter="url(#glow)"/>
  <!-- Microphone on top of the N's right leg -->
  <use href="#mic" fill="#000000" stroke="#000000" opacity="0.4" transform="translate(0 7)"/>
  <g filter="url(#glow)">
    <use href="#mic" fill="url(#micGrad)" stroke="#FFFFFF"/>
  </g>
  <g stroke="#EF4444" stroke-opacity="0.55" stroke-width="4" stroke-linecap="round">
    <path d="M354 186 H370 M354 198 H370 M354 210 H370"/>
  </g>
</svg>
